<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Whispr HUD</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 14px; padding: 0 18px;
    background: #17172282; background: #171722; color: #f0f0f8;
    font: 14px/1.4 system-ui, sans-serif; border-radius: 14px;
    border: 1px solid #2e2e44;
    cursor: grab; user-select: none;
  }
  body:active { cursor: grabbing; }
  #dot {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    background: #ef4444; animation: pulse 1.2s ease-in-out infinite;
  }
  #dot.idle { background: #64648a; animation: none; }
  @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.85); } }
  #content { flex: 1; min-width: 0; }
  #text {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl; text-align: left;  /* keep the tail of long partials visible */
    min-height: 20px;
  }
  #text span { direction: ltr; unicode-bidi: bidi-override; }
  #meter { height: 4px; background: #2b2b40; border-radius: 2px; margin-top: 7px; overflow: hidden; }
  #meterFill { height: 100%; width: 0%; background: linear-gradient(90deg, #4f46e5, #a78bfa); transition: width 90ms linear; }
  #hint { color: #7a7a96; font-size: 11.5px; flex-shrink: 0; }
</style>
</head>
<body data-tauri-drag-region>
  <div id="dot"></div>
  <div id="content">
    <div id="text"><span>Listening…</span></div>
    <div id="meter"><div id="meterFill"></div></div>
  </div>
  <div id="hint">hotkey to stop</div>
<script>
  const { listen } = window.__TAURI__.event;
  const textEl = document.querySelector("#text span");
  const dot = document.getElementById("dot");
  const fill = document.getElementById("meterFill");

  // Explicitly start native window dragging. The data attribute is retained
  // as the declarative Tauri drag region and as a no-JS fallback.
  document.body.addEventListener("mousedown", (event) => {
    if (event.button === 0) {
      window.__TAURI__.window.getCurrentWindow().startDragging();
    }
  });

  listen("whispr://event", ({ payload }) => {
    switch (payload.kind) {
      case "status":
        dot.className = payload.recording ? "" : "idle";
        if (payload.recording) textEl.textContent = "Listening…";
        break;
      case "partial":
        textEl.textContent = payload.text;
        break;
      case "final":
        textEl.textContent = payload.text || "(nothing heard)";
        dot.className = "idle";
        fill.style.width = "0%";
        break;
      case "level": {
        const pct = Math.min(100, Math.round(Math.sqrt(payload.value) * 160));
        fill.style.width = pct + "%";
        break;
      }
      case "error":
        textEl.textContent = "⚠ " + payload.message;
        dot.className = "idle";
        break;
    }
  });
</script>
</body>
</html>
